<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='600' viewBox='0 0 1200 600' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<rect width='1200' height='600' fill='#ffffff'/>
<text x='600.0' y='34.0' font-size='24.0' text-anchor='middle' font-weight='bold' fill='#1a1a1a'>One worker = one 'factory'</text>
<text x='600.0' y='62.0' font-size='15.0' text-anchor='middle' font-weight='normal' fill='#1a1a1a'>one openssl speed process, pinned to one vCPU, hashing one 16 KiB block over and over for 60 seconds</text>
<rect x='300.0' y='100.0' width='600.0' height='360.0' fill='#e8f1fa' stroke='#1F6FB2' stroke-width='3.00' rx='14' fill-opacity='1.0'/>
<text x='600.0' y='132.0' font-size='17.0' text-anchor='middle' font-weight='bold' fill='#1F6FB2'>vCPU N   (pinned with  taskset -c N)</text>
<rect x='328.0' y='162.0' width='215.0' height='150.0' fill='#ffffff' stroke='#1a1a1a' stroke-width='2.00' rx='8' fill-opacity='1.0'/>
<text x='435.5' y='188.0' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#1a1a1a'>L1 cache of this core</text>
<rect x='350.0' y='206.0' width='171.0' height='62.0' fill='#bcd4ec' stroke='#1F6FB2' stroke-width='2.00' rx='6' fill-opacity='1.0'/>
<text x='435.5' y='232.0' font-size='16.0' text-anchor='middle' font-weight='bold' fill='#1a1a1a'>16 KiB block</text>
<text x='435.5' y='254.0' font-size='12.0' text-anchor='middle' font-weight='normal' fill='#1a1a1a'>same bytes each time</text>
<text x='435.5' y='298.0' font-size='12.0' text-anchor='middle' font-weight='normal' fill='#1a1a1a'>read ~110,000 times per second</text>
<rect x='657.0' y='162.0' width='215.0' height='150.0' fill='#ffffff' stroke='#1a1a1a' stroke-width='2.00' rx='8' fill-opacity='1.0'/>
<text x='764.5' y='188.0' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#1a1a1a'>execution unit of this core</text>
<rect x='679.0' y='206.0' width='171.0' height='62.0' fill='#f6c7bf' stroke='#C0392B' stroke-width='2.00' rx='6' fill-opacity='1.0'/>
<text x='764.5' y='232.0' font-size='17.0' text-anchor='middle' font-weight='bold' fill='#1a1a1a'>SHA-256</text>
<text x='764.5' y='254.0' font-size='12.0' text-anchor='middle' font-weight='normal' fill='#1a1a1a'>sha_ni instructions</text>
<text x='764.5' y='298.0' font-size='12.5' text-anchor='middle' font-weight='bold' fill='#C0392B'>the only limiting resource</text>
<line x1='551.0' y1='220.0' x2='647.0' y2='220.0' stroke='#1F6FB2' stroke-width='3.00'/>
<line x1='633.0' y1='220.0' x2='649.0' y2='220.0' stroke='#1F6FB2' stroke-width='1.80'/>
<line x1='649.0' y1='220.0' x2='641.3' y2='224.6' stroke='#1F6FB2' stroke-width='1.80'/>
<line x1='649.0' y1='220.0' x2='641.3' y2='215.4' stroke='#1F6FB2' stroke-width='1.80'/>
<text x='600.0' y='210.0' font-size='14.0' text-anchor='middle' font-weight='bold' fill='#1F6FB2'>block in</text>
<line x1='649.0' y1='270.0' x2='553.0' y2='270.0' stroke='#1F6FB2' stroke-width='3.00'/>
<line x1='567.0' y1='270.0' x2='551.0' y2='270.0' stroke='#1F6FB2' stroke-width='1.80'/>
<line x1='551.0' y1='270.0' x2='558.7' y2='265.4' stroke='#1F6FB2' stroke-width='1.80'/>
<line x1='551.0' y1='270.0' x2='558.7' y2='274.6' stroke='#1F6FB2' stroke-width='1.80'/>
<text x='600.0' y='290.0' font-size='14.0' text-anchor='middle' font-weight='bold' fill='#1F6FB2'>done, again</text>
<text x='600.0' y='248.0' font-size='13.0' text-anchor='middle' font-weight='normal' fill='#1a1a1a'>tight loop</text>
<rect x='328.0' y='340.0' width='262.0' height='78.0' fill='#ffffff' stroke='#1a1a1a' stroke-width='2.00' rx='8' fill-opacity='1.0'/>
<text x='459.0' y='370.0' font-size='16.0' text-anchor='middle' font-weight='bold' fill='#1a1a1a'>timer: 60 seconds</text>
<text x='459.0' y='396.0' font-size='12.5' text-anchor='middle' font-weight='normal' fill='#1a1a1a'>wall-clock time  (-elapsed)</text>
<rect x='610.0' y='340.0' width='262.0' height='78.0' fill='#ffffff' stroke='#1a1a1a' stroke-width='2.00' rx='8' fill-opacity='1.0'/>
<text x='741.0' y='370.0' font-size='16.0' text-anchor='middle' font-weight='bold' fill='#1a1a1a'>counter: hashes finished</text>
<text x='741.0' y='396.0' font-size='12.5' text-anchor='middle' font-weight='normal' fill='#1a1a1a'>+1 per completed 16 KiB hash</text>
<line x1='904.0' y1='280.0' x2='956.0' y2='280.0' stroke='#1a1a1a' stroke-width='3.00'/>
<line x1='940.0' y1='280.0' x2='964.0' y2='280.0' stroke='#1a1a1a' stroke-width='1.80'/>
<line x1='964.0' y1='280.0' x2='956.3' y2='284.6' stroke='#1a1a1a' stroke-width='1.80'/>
<line x1='964.0' y1='280.0' x2='956.3' y2='275.4' stroke='#1a1a1a' stroke-width='1.80'/>
<rect x='970.0' y='180.0' width='220.0' height='200.0' fill='#fff2cc' stroke='#8a5a00' stroke-width='2.50' rx='8' fill-opacity='1.0'/>
<text x='1080.0' y='208.0' font-size='14.0' text-anchor='middle' font-weight='bold' fill='#1a1a1a'>reported after 60 s</text>
<text x='1080.0' y='238.0' font-size='15.0' text-anchor='middle' font-weight='normal' fill='#1a1a1a' font-family='monospace'>counter x 16,384</text>
<text x='1080.0' y='260.0' font-size='15.0' text-anchor='middle' font-weight='normal' fill='#1a1a1a' font-family='monospace'>-----------------</text>
<text x='1080.0' y='282.0' font-size='15.0' text-anchor='middle' font-weight='normal' fill='#1a1a1a' font-family='monospace'>60 seconds</text>
<text x='1080.0' y='314.0' font-size='15.0' text-anchor='middle' font-weight='bold' fill='#1a1a1a'>= bytes per second</text>
<text x='1080.0' y='342.0' font-size='13.5' text-anchor='middle' font-weight='normal' fill='#1a1a1a' font-family='monospace'>e.g. 1,805,103 kB/s</text>
<text x='1080.0' y='364.0' font-size='12.5' text-anchor='middle' font-weight='normal' fill='#1a1a1a'>= 1.81 GB/s, worker alone</text>
<text x='1080.0' y='410.0' font-size='14.0' text-anchor='middle' font-weight='normal' fill='#1a1a1a'>This number is the worker's</text>
<text x='1080.0' y='434.0' font-size='18.0' text-anchor='middle' font-weight='bold' fill='#8a5a00'>THROUGHPUT</text>
<text x='135.0' y='124.0' font-size='16.0' text-anchor='middle' font-weight='bold' fill='#1a1a1a'>NOT involved</text>
<rect x='40.0' y='150.0' width='190.0' height='52.0' fill='#f0f0f0' stroke='#666' stroke-width='1.80' rx='8' fill-opacity='1.0'/>
<text x='135.0' y='183.0' font-size='15.0' text-anchor='middle' font-weight='normal' fill='#1a1a1a'>disk</text>
<line x1='236.0' y1='176.0' x2='290.0' y2='176.0' stroke='#888' stroke-width='2.00' stroke-dasharray='6,5'/>
<line x1='268.0' y1='164.0' x2='292.0' y2='188.0' stroke='#C0392B' stroke-width='3.50'/>
<line x1='268.0' y1='188.0' x2='292.0' y2='164.0' stroke='#C0392B' stroke-width='3.50'/>
<rect x='40.0' y='226.0' width='190.0' height='52.0' fill='#f0f0f0' stroke='#666' stroke-width='1.80' rx='8' fill-opacity='1.0'/>
<text x='135.0' y='259.0' font-size='15.0' text-anchor='middle' font-weight='normal' fill='#1a1a1a'>network</text>
<line x1='236.0' y1='252.0' x2='290.0' y2='252.0' stroke='#888' stroke-width='2.00' stroke-dasharray='6,5'/>
<line x1='268.0' y1='240.0' x2='292.0' y2='264.0' stroke='#C0392B' stroke-width='3.50'/>
<line x1='268.0' y1='264.0' x2='292.0' y2='240.0' stroke='#C0392B' stroke-width='3.50'/>
<rect x='40.0' y='302.0' width='190.0' height='52.0' fill='#f0f0f0' stroke='#666' stroke-width='1.80' rx='8' fill-opacity='1.0'/>
<text x='135.0' y='335.0' font-size='15.0' text-anchor='middle' font-weight='normal' fill='#1a1a1a'>main memory (RAM)</text>
<line x1='236.0' y1='328.0' x2='290.0' y2='328.0' stroke='#888' stroke-width='2.00' stroke-dasharray='6,5'/>
<line x1='268.0' y1='316.0' x2='292.0' y2='340.0' stroke='#C0392B' stroke-width='3.50'/>
<line x1='268.0' y1='340.0' x2='292.0' y2='316.0' stroke='#C0392B' stroke-width='3.50'/>
<rect x='40.0' y='378.0' width='190.0' height='52.0' fill='#f0f0f0' stroke='#666' stroke-width='1.80' rx='8' fill-opacity='1.0'/>
<text x='135.0' y='411.0' font-size='15.0' text-anchor='middle' font-weight='normal' fill='#1a1a1a'>other workers</text>
<line x1='236.0' y1='404.0' x2='290.0' y2='404.0' stroke='#888' stroke-width='2.00' stroke-dasharray='6,5'/>
<line x1='268.0' y1='392.0' x2='292.0' y2='416.0' stroke='#C0392B' stroke-width='3.50'/>
<line x1='268.0' y1='416.0' x2='292.0' y2='392.0' stroke='#C0392B' stroke-width='3.50'/>
<text x='600.0' y='500.0' font-size='15.0' text-anchor='middle' font-weight='normal' fill='#1a1a1a'>N workers = N copies of this, each on its own vCPU, all started at the same instant.</text>
<text x='600.0' y='526.0' font-size='15.0' text-anchor='middle' font-weight='normal' fill='#1a1a1a'>They never talk to each other. Aggregate throughput = the sum of the N reported numbers.</text>
<rect x='60.0' y='548.0' width='1080.0' height='36.0' fill='#fde8e4' stroke='#C0392B' stroke-width='1.50' rx='8' fill-opacity='1.0'/>
<text x='600.0' y='572.0' font-size='14.0' text-anchor='middle' font-weight='bold' fill='#C0392B'>Nothing outside the core is used, so a worker can only slow down if its core is shared with another worker (SMT) or runs at a lower clock.</text>
</svg>
