<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='470' viewBox='0 0 1000 470' font-family='Segoe UI, Helvetica, Arial, sans-serif'>
<rect width='1000' height='470' fill='#ffffff'/>
<text x='500.0' y='28.0' font-size='15.5' text-anchor='middle' font-weight='bold' fill='#222'>One worker = one 'factory': one openssl speed process pinned to one vCPU, hashing one 16 KiB block for 60 s</text>
<rect x='250.0' y='70.0' width='500.0' height='270.0' fill='#f3f7fb' stroke='#1F6FB2' stroke-width='1.6' rx='10' fill-opacity='1.0'/>
<text x='500.0' y='92.0' font-size='13' text-anchor='middle' font-weight='bold' fill='#1F6FB2'>vCPU N  (pinned with taskset -c N)</text>
<rect x='272.0' y='130.0' width='160.0' height='110.0' fill='#fff' stroke='#777' stroke-width='1.2' rx='6' fill-opacity='1.0'/>
<text x='352.0' y='148.0' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#333'>L1 cache of this core</text>
<rect x='297.0' y='162.0' width='110.0' height='50.0' fill='#dfe9f3' stroke='#1F6FB2' stroke-width='1.2' rx='4' fill-opacity='1.0'/>
<text x='352.0' y='182.0' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>16 KiB block</text>
<text x='352.0' y='200.0' font-size='9.5' text-anchor='middle' font-weight='normal' fill='#555'>(same bytes each time)</text>
<text x='352.0' y='232.0' font-size='10' text-anchor='middle' font-weight='normal' fill='#555'>read ~110,000 times/s</text>
<rect x='568.0' y='130.0' width='160.0' height='110.0' fill='#fff' stroke='#777' stroke-width='1.2' rx='6' fill-opacity='1.0'/>
<text x='648.0' y='148.0' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#333'>execution unit</text>
<rect x='588.0' y='162.0' width='120.0' height='50.0' fill='#fde8e4' stroke='#C0392B' stroke-width='1.2' rx='4' fill-opacity='1.0'/>
<text x='648.0' y='182.0' font-size='13' text-anchor='middle' font-weight='bold' fill='#222'>SHA-256</text>
<text x='648.0' y='200.0' font-size='10' text-anchor='middle' font-weight='normal' fill='#555'>sha_ni instructions</text>
<text x='648.0' y='232.0' font-size='10' text-anchor='middle' font-weight='normal' fill='#C0392B'>the only limiting resource</text>
<line x1='438.0' y1='174.0' x2='562.0' y2='174.0' stroke='#1F6FB2' stroke-width='1.8'/>
<line x1='562.0' y1='174.0' x2='554.3' y2='178.6' stroke='#1F6FB2' stroke-width='1.8'/>
<line x1='562.0' y1='174.0' x2='554.3' y2='169.4' stroke='#1F6FB2' stroke-width='1.8'/>
<text x='500.0' y='166.0' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#1F6FB2'>block in</text>
<line x1='562.0' y1='210.0' x2='438.0' y2='210.0' stroke='#1F6FB2' stroke-width='1.8'/>
<line x1='438.0' y1='210.0' x2='445.7' y2='205.4' stroke='#1F6FB2' stroke-width='1.8'/>
<line x1='438.0' y1='210.0' x2='445.7' y2='214.6' stroke='#1F6FB2' stroke-width='1.8'/>
<text x='500.0' y='226.0' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#1F6FB2'>done, again</text>
<text x='500.0' y='192.0' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#555'>tight loop</text>
<rect x='280.0' y='270.0' width='200.0' height='48.0' fill='#fff' stroke='#777' stroke-width='1.2' rx='6' fill-opacity='1.0'/>
<text x='380.0' y='290.0' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>timer: 60 seconds</text>
<text x='380.0' y='307.0' font-size='10' text-anchor='middle' font-weight='normal' fill='#555'>wall-clock (-elapsed)</text>
<rect x='520.0' y='270.0' width='200.0' height='48.0' fill='#fff' stroke='#777' stroke-width='1.2' rx='6' fill-opacity='1.0'/>
<text x='620.0' y='290.0' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>counter: hashes finished</text>
<text x='620.0' y='307.0' font-size='10' text-anchor='middle' font-weight='normal' fill='#555'>+1 per completed 16 KiB hash</text>
<line x1='754.0' y1='205.0' x2='804.0' y2='205.0' stroke='#333' stroke-width='1.8'/>
<line x1='804.0' y1='205.0' x2='796.3' y2='209.6' stroke='#333' stroke-width='1.8'/>
<line x1='804.0' y1='205.0' x2='796.3' y2='200.4' stroke='#333' stroke-width='1.8'/>
<rect x='810.0' y='165.0' width='180.0' height='80.0' fill='#fff8e6' stroke='#b8860b' stroke-width='1.4' rx='6' fill-opacity='1.0'/>
<text x='900.0' y='185.0' font-size='11' text-anchor='middle' font-weight='normal' fill='#333'>reported after 60 s:</text>
<text x='900.0' y='205.0' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#222' font-family='monospace'>counter x 16,384 / 60</text>
<text x='900.0' y='225.0' font-size='12' text-anchor='middle' font-weight='bold' fill='#222'>= bytes per second</text>
<text x='900.0' y='265.0' font-size='11' text-anchor='middle' font-weight='normal' fill='#333' font-family='monospace'>e.g. 1,805,103 kB/s</text>
<text x='900.0' y='281.0' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#555'>= 1.81 GB/s, one worker alone</text>
<text x='900.0' y='297.0' font-size='10.5' text-anchor='middle' font-weight='normal' fill='#333'>This number is the worker's</text>
<text x='900.0' y='311.0' font-size='11' text-anchor='middle' font-weight='bold' fill='#333'>THROUGHPUT.</text>
<text x='125.0' y='80.0' font-size='12' text-anchor='middle' font-weight='bold' fill='#777'>not involved</text>
<rect x='40.0' y='110.0' width='170.0' height='38.0' fill='#fafafa' stroke='#bbb' stroke-width='1' rx='6' fill-opacity='1.0'/>
<text x='125.0' y='134.0' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#555'>disk</text>
<line x1='220.0' y1='129.0' x2='242.0' y2='129.0' stroke='#bbb' stroke-width='1.2' stroke-dasharray='4,4'/>
<line x1='228.0' y1='121.0' x2='242.0' y2='137.0' stroke='#C0392B' stroke-width='2'/>
<line x1='228.0' y1='137.0' x2='242.0' y2='121.0' stroke='#C0392B' stroke-width='2'/>
<rect x='40.0' y='170.0' width='170.0' height='38.0' fill='#fafafa' stroke='#bbb' stroke-width='1' rx='6' fill-opacity='1.0'/>
<text x='125.0' y='194.0' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#555'>network</text>
<line x1='220.0' y1='189.0' x2='242.0' y2='189.0' stroke='#bbb' stroke-width='1.2' stroke-dasharray='4,4'/>
<line x1='228.0' y1='181.0' x2='242.0' y2='197.0' stroke='#C0392B' stroke-width='2'/>
<line x1='228.0' y1='197.0' x2='242.0' y2='181.0' stroke='#C0392B' stroke-width='2'/>
<rect x='40.0' y='230.0' width='170.0' height='38.0' fill='#fafafa' stroke='#bbb' stroke-width='1' rx='6' fill-opacity='1.0'/>
<text x='125.0' y='254.0' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#555'>main memory (RAM)</text>
<line x1='220.0' y1='249.0' x2='242.0' y2='249.0' stroke='#bbb' stroke-width='1.2' stroke-dasharray='4,4'/>
<line x1='228.0' y1='241.0' x2='242.0' y2='257.0' stroke='#C0392B' stroke-width='2'/>
<line x1='228.0' y1='257.0' x2='242.0' y2='241.0' stroke='#C0392B' stroke-width='2'/>
<rect x='40.0' y='290.0' width='170.0' height='38.0' fill='#fafafa' stroke='#bbb' stroke-width='1' rx='6' fill-opacity='1.0'/>
<text x='125.0' y='314.0' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#555'>other workers</text>
<line x1='220.0' y1='309.0' x2='242.0' y2='309.0' stroke='#bbb' stroke-width='1.2' stroke-dasharray='4,4'/>
<line x1='228.0' y1='301.0' x2='242.0' y2='317.0' stroke='#C0392B' stroke-width='2'/>
<line x1='228.0' y1='317.0' x2='242.0' y2='301.0' stroke='#C0392B' stroke-width='2'/>
<text x='500.0' y='410.0' font-size='12.5' text-anchor='middle' font-weight='normal' fill='#333'>N workers = N copies of this, each on its own vCPU, started at the same instant.</text>
<text x='500.0' y='430.0' font-size='12.5' text-anchor='middle' font-weight='normal' fill='#333'>They never talk to each other. Aggregate throughput = the sum of the N reported numbers.</text>
<text x='500.0' y='454.0' font-size='11.5' text-anchor='middle' font-weight='normal' fill='#C0392B'>Because nothing outside the core is used, a worker can only slow down if its core is shared with another worker (SMT) or runs at a lower clock.</text>
</svg>
